name: Daily NSE MWPL Fetch

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 7:00 PM IST, Mon-Fri (cron runs in UTC)
  workflow_dispatch: {}        # lets you trigger it manually from the GitHub UI

permissions:
  contents: write             # needed so the workflow can commit data/ back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python run_daily.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily MWPL data update $(date +%F)"
          git push
